name: clients

on:
  push:
    branches: [main]
    paths: [clients/**, .github/workflows/clients.yml]
  pull_request:
    paths: [clients/**, .github/workflows/clients.yml]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # Also validates the Gradle wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: ktlint
        run: ./ktlint.sh
      # Release builds need the backend settings and run in the release workflow.
      - name: Build, test and lint
        run: ./gradlew --no-daemon :shared:build :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
