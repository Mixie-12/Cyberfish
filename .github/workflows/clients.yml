name: clients

on:
  push:
    branches: [main]
    # Path filters do not apply to tags: every v* tag builds the installer.
    tags: ["v*"]
    paths: [clients/**, device/image.json, device/cloud-init/**, device/host/**, .github/workflows/clients.yml]
  pull_request:
    paths: [clients/**, device/image.json, device/cloud-init/**, device/host/**, .github/workflows/clients.yml]

permissions: {}

concurrency:
  group: clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      # Also validates the Gradle wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: ktlint
        run: ./ktlint.sh
      # Release builds need the backend settings and run in the release workflow.
      - name: Build, test and lint
        run: ./gradlew --no-daemon :shared:build :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :burner:build
      # Debian trixie is the base of the pinned Raspberry Pi OS image.
      - name: Validate rendered cloud-init files with cloud-init
        working-directory: .
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
          sh /repo/clients/shared/check-cloud-init.sh

  # On a v* tag: the DeKoi Setup MSI and its checksum on the GitHub Release.
  # Unsigned for the MVP (code-signing certificates are on the roadmap).
  burner-msi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clients
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the MSI
        run: ./gradlew --no-daemon :burner:packageMsi -Pdekoi.version="${GITHUB_REF_NAME#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi="dekoi-setup-$GITHUB_REF_NAME.msi"
          cp burner/build/compose/binaries/main/msi/*.msi "$msi"
          sha256sum "$msi" > "$msi.sha256"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "DeKoi $GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" --clobber "$msi" "$msi.sha256"
