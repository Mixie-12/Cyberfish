name: expiry

# Credentials that cannot rotate themselves have their expiry or retirement
# date in a repository variable named EXPIRES_<secret>, as YYYY-MM-DD. From
# REMIND_DAYS before that date, this opens one issue per credential that
# points at docs/runbooks/rotate-keys.md, assigned to the repository owner,
# whom GitHub emails (ADR 0038).

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions: {}

# Two runs at once could both find no issue and open two.
concurrency:
  group: expiry
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VARS: ${{ toJSON(vars) }}
      REMIND_DAYS: 30
    steps:
      # A credential without a date would expire without a reminder. A
      # failed run opens the issue "expiry failed" (failures.yml).
      - name: Every credential replaced by hand has a date
        run: |
          status=0
          for key in EXPIRES_SUPABASE_ACCESS_TOKEN EXPIRES_GOOGLE_WEB_CLIENT_SECRET; do
            if ! jq -e --arg key "$key" 'has($key)' <<< "$VARS" > /dev/null; then
              echo "::error::$key is not set; see docs/runbooks/rotate-keys.md"
              status=1
            fi
          done
          exit "$status"
      - name: Open an issue for each credential close to its date
        if: ${{ !cancelled() }}
        run: |
          now="$(date -u +%s)"
          jq -r 'to_entries[] | select(.key | startswith("EXPIRES_")) | "\(.key) \(.value)"' <<< "$VARS" |
            while read -r key date; do
              name="${key#EXPIRES_}"
              if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::$key is not a date (YYYY-MM-DD)"
                exit 1
              fi
              days=$(( ($(date -u -d "$date" +%s) - now) / 86400 ))
              echo "$name: $date, in $days days"
              if [ "$days" -gt "$REMIND_DAYS" ]; then continue; fi
              title="Rotate $name before $date"
              open="$(gh issue list --state open --search "\"$title\" in:title" --json title |
                jq --arg title "$title" 'map(select(.title == $title)) | length')"
              if [ "$open" = 0 ]; then
                gh issue create --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" \
                  --body "$name expires or retires on $date. Steps: docs/runbooks/rotate-keys.md. Then set the repository variable $key to the new date."
              fi
            done
