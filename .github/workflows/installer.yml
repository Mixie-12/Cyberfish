name: installer

# Builds the bundle the phone copies onto a card (ADR 0031) and publishes it
# to GHCR as one application/zip layer, whose digest is the zip's SHA-256.
# Nothing uses a new bundle until device/installer.json pins its digest
# (docs/runbooks/release.md). Pull requests are checked by device.yml.

on:
  push:
    branches: [main]
    paths:
      - device/installer/**
      - device/image.json
      - .github/workflows/installer.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ghcr.io/mixie-12/dekoi-installer
      ORAS_VERSION: 1.3.6
      ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Unit tests
        working-directory: device
        run: uvx --python 3.13 --from pytest==8.3.5 pytest -q installer/tests
      # The build starts the bundle's arm64 Python and busybox as a check.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build the bundle
        run: docker build -f device/installer/Containerfile -o "$RUNNER_TEMP/bundle" device
      - name: Install ORAS
        run: |
          archive="$RUNNER_TEMP/oras.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" oras
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The registry's manifest must name exactly the zip that was built.
      - name: Push as one application/zip layer
        working-directory: ${{ runner.temp }}/bundle
        run: |
          "$RUNNER_TEMP/oras" push "$REPOSITORY:$GITHUB_SHA" dekoi-installer.zip:application/zip
          digest="sha256:$(sha256sum dekoi-installer.zip | cut -d ' ' -f 1)"
          size="$(stat -c %s dekoi-installer.zip)"
          "$RUNNER_TEMP/oras" manifest fetch "$REPOSITORY:$GITHUB_SHA" | jq -e \
            --arg digest "$digest" --argjson size "$size" \
            '.layers == [.layers[0]] and .layers[0].mediaType == "application/zip"
              and .layers[0].digest == $digest and .layers[0].size == $size' > /dev/null
          pin="$(jq -nc --arg repository "${REPOSITORY#ghcr.io/}" --arg digest "$digest" \
            --argjson size "$size" '{repository: $repository, digest: $digest, size: $size}')"
          echo "$pin"
          printf 'device/installer.json for this build:\n\n    %s\n' "$pin" >> "$GITHUB_STEP_SUMMARY"
