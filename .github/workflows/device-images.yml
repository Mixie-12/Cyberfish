name: device images

# Devices follow :stable through podman auto-update and accept only images
# signed with the DeKoi key. Pushes to main publish :edge; v* tags publish
# :stable; the weekly run rebuilds the latest release on fresh Debian packages.

on:
  push:
    branches: [main]
    paths: [device/agent/**, device/canary/**, .github/workflows/device-images.yml]
    tags: ["v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: device-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [canary, agent]
    env:
      IMAGE: ghcr.io/mixie-12/dekoi-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Choose code, channel and version
        id: release
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          if [ "$IMAGE_NAME" = agent ] && [ -z "$PROJECT_REF" ]; then
            echo "The agent needs SUPABASE_PROJECT_REF; skipping until the backend is bootstrapped."
            exit 0
          fi
          case "$GITHUB_EVENT_NAME/$GITHUB_REF" in
            push/refs/tags/v*)
              channel=stable version="${GITHUB_REF_NAME#v}" ;;
            schedule/*)
              tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null) || { echo "No release yet."; exit 0; }
              git checkout -q "$tag"
              channel=stable version="${tag#v}" ;;
            *)
              channel=edge version="edge-${GITHUB_SHA::12}" ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.release.outputs.channel
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.channel
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.release.outputs.channel
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by revision
        id: build
        if: steps.release.outputs.channel
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: device
          file: device/${{ matrix.image }}/Containerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.revision }}
          build-args: |
            DEKOI_API_URL=https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
            DEKOI_API_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
            DEKOI_AGENT_VERSION=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.release.outputs.channel
        with:
          cosign-release: v3.1.4
      - name: Sign, check against the key on the devices, then move the channel tag
        if: steps.release.outputs.channel
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY \
            --use-signing-config=false --new-bundle-format=false --tlog-upload=false \
            "$IMAGE@$DIGEST"
          cosign verify --key device/host/etc/dekoi/cosign.pub --insecure-ignore-tlog=true \
            "$IMAGE@$DIGEST" > /dev/null
          docker buildx imagetools create --tag "$IMAGE:$CHANNEL" "$IMAGE@$DIGEST"
