name: backend

on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/backend.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Start database, auth and API
        run: supabase start -x imgproxy,logflare,vector,supavisor,mailpit,studio,edge-runtime,realtime,storage-api
      - name: pgTAP tests
        run: supabase test db
      - name: Security and performance advisors
        run: supabase db advisors --type all --fail-on warn

  functions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/supabase/functions/notify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type check
        run: deno check *.ts
      - name: Tests
        run: deno test --no-prompt

  # GitOps deploy to Supabase Cloud (ADR 0002). Skipped until the owner has
  # set the SUPABASE_PROJECT_REF variable and the secrets.
  deploy:
    needs: [database, functions]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ENV: production
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Written to Vault by `supabase db push` ([db.vault] in config.toml).
      NOTIFY_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/notify
      NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      # Sign in with Google ([auth.external.google] in config.toml).
      SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED: ${{ vars.GOOGLE_WEB_CLIENT_ID != '' }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      # The backend deploys without Firebase; pushes start once
      # FCM_SERVICE_ACCOUNT exists (docs/runbooks/deploy-backend.md).
      - name: Check the notification secrets
        run: |
          if [ -z "$NOTIFY_SECRET" ]; then
            echo "::error::NOTIFY_SECRET must be set (docs/runbooks/deploy-backend.md)"
            exit 1
          fi
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::warning::FCM_SERVICE_ACCOUNT is not set; push notifications stay off until it is"
          fi
      # Google answers a made-up code with invalid_grant only when the client
      # ID and secret belong to the same web client; an Android client ID or a
      # wrong secret gets invalid_client. Fails here instead of on the phone.
      - name: Check the Google sign-in client
        if: vars.GOOGLE_WEB_CLIENT_ID != ''
        run: |
          error="$(printf %s "$SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET" | curl -sS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret@-" \
            --data-urlencode "redirect_uri=https://$PROJECT_REF.supabase.co/auth/v1/callback" \
            -d grant_type=authorization_code -d code=dekoi-ci-check | jq -r .error)"
          if [ "$error" != invalid_grant ]; then
            echo "::error::Google refused GOOGLE_WEB_CLIENT_ID with GOOGLE_WEB_CLIENT_SECRET ($error); see docs/runbooks/google-firebase.md"
            exit 1
          fi
      - name: Set function secrets
        run: |
          secrets=("NOTIFY_SECRET=$NOTIFY_SECRET")
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then secrets+=("FCM_SERVICE_ACCOUNT=$FCM_SERVICE_ACCOUNT"); fi
          supabase secrets set --remote="$PROJECT_REF" --yes "${secrets[@]}"
      - name: Deploy functions
        run: supabase functions deploy notify --remote="$PROJECT_REF" --use-api --yes
      - name: Apply migrations
        run: supabase db push --remote="$PROJECT_REF" --yes
      - name: Show configuration changes
        run: supabase config diff --remote="$PROJECT_REF"
      - name: Apply configuration
        run: supabase config push --remote="$PROJECT_REF" --yes
