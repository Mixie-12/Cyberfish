name: repo

on:
  push:
    branches: [main]
  pull_request:
  # Started on a branch where GITHUB_TOKEN events start nothing (ADR 0036).
  workflow_dispatch:

permissions: {}

concurrency:
  group: repo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gitleaks binary itself, checked against a pinned SHA-256: the action
  # downloads it unchecked and needs a token to read pull requests.
  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: 8.30.1
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  # failures.yml reports only the workflows it names.
  watched:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: failures.yml names every other workflow, and only those
        run: |
          names="$(yq -o=json -I=0 '.name' .github/workflows/*.yml | jq -sc '. - ["failures"]')"
          watched="$(yq -o=json -I=0 '.on.workflow_run.workflows' .github/workflows/failures.yml)"
          differences="$(jq -nc --argjson names "$names" --argjson watched "$watched" \
            '{"not watched": ($names - $watched), "not a workflow": ($watched - $names)}')"
          echo "$differences"
          jq -e 'all(.[]; . == [])' <<< "$differences" > /dev/null
