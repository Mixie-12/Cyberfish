  <use href="#fish" xlink:href="#fish" x="468" y="863" width="18" height="6.8" fill="#2EA8FF"/>
  <text x="491" y="870" style="font-size:9.5px;fill:#6F84A3">DeKoi · now</text>
  <text x="468" y="888" style="font-size:11px;font-weight:600;fill:#F4FBFF">Someone tried</text>
  <text x="468" y="902" style="font-size:11px;font-weight:600;fill:#F4FBFF">to sign in to</text>
  <text x="468" y="916" style="font-size:11px;font-weight:600;fill:#F4FBFF">your DeKoi</text>
  <rect x="460" y="946" width="104" height="7" rx="3.5" fill="#16243A"/>
