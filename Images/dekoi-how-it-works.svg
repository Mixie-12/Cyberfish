<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="title desc">
  <title id="title">How DeKoi works</title>
  <desc id="desc">On the home network, a firewall on the Raspberry Pi lets Eve reach only the decoys. The decoys and the IDS write logs that the agent reads one way. The agent drops typed passwords and sends events to the Supabase cloud over HTTPS, outbound only. The device API checks the device secret and every field, Postgres row-level security keeps each owner's data separate, and the notify function sends a fixed message with the event id through Firebase Cloud Messaging to Alice's phone. DeKoi Setup writes the SD card and shows a one-time pairing code; the Pi runs only signed images.</desc>
