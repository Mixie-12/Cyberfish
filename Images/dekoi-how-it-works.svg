  <text x="730" y="317">Drops typed passwords</text>
  <text x="730" y="335">before anything leaves</text>
  <text x="730" y="361">Watches the LAN: sweeps,</text>
  <text x="730" y="379">ARP spoofing, rogue DHCP</text>
  <text x="730" y="397">and routers, name poisoning</text>
  <text x="730" y="423">Heartbeat every 60 s; keeps</text>
  <text x="730" y="441">events through outages</text>

  <line x1="817" y1="476" x2="817" y2="614" stroke="#2EA8FF" stroke-width="2.5" marker-end="url(#arBlue)"/>
  <circle cx="817" cy="540" r="14" fill="#040A15" stroke="#2EA8FF" stroke-width="2"/>
  <use href="#ic-lock" xlink:href="#ic-lock" x="809" y="532" width="16" height="16" fill="none" stroke="#2EA8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h r" x="795" y="536">HTTPS, outbound only</text>
  <text class="r" x="795" y="555">The Pi makes every connection itself. The cloud never connects in.</text>

  <rect x="24" y="570" width="952" height="200" rx="18" fill="#081221" stroke="#17263D"/>
  <text class="label" x="46" y="600">SUPABASE CLOUD, EU REGION</text>

  <rect x="700" y="616" width="234" height="134" rx="12" fill="#0E1D33" stroke="#22395A"/>
  <use href="#ic-key" xlink:href="#ic-key" x="716" y="628" width="18" height="18" fill="none" stroke="#2EA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="740" y="642">Device API</text>
  <text class="small dim mono r" x="918" y="642">v1</text>
  <text x="716" y="666">Checks each device's 256-bit</text>
  <text x="716" y="684">secret, stored only as a hash.</text>
  <text x="716" y="708">Checks every field: size, type,</text>
  <text x="716" y="726">no control characters.</text>

  <line x1="700" y1="683" x2="642" y2="683" stroke="#2EA8FF" stroke-width="2" marker-end="url(#arBlue)"/>

  <rect x="380" y="616" width="260" height="134" rx="12" fill="#0E1D33" stroke="#22395A"/>
  <use href="#ic-db" xlink:href="#ic-db" x="396" y="628" width="18" height="18" fill="none" stroke="#2EA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="420" y="642">Postgres</text>
  <text x="396" y="666">Row-level security: every owner</text>
  <text x="396" y="684">reads only their own rows.</text>
  <text x="396" y="708">Offline check every 5 minutes.</text>
  <text x="396" y="726">Data kept 90 days.</text>

  <line x1="380" y1="683" x2="348" y2="683" stroke="#2EA8FF" stroke-width="2" marker-end="url(#arBlue)"/>

  <rect x="46" y="616" width="300" height="134" rx="12" fill="#0E1D33" stroke="#22395A"/>
  <use href="#ic-bell" xlink:href="#ic-bell" x="62" y="628" width="18" height="18" fill="none" stroke="#2EA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h mono" x="86" y="642">notify</text>
  <text class="small dim r" x="330" y="642">Edge Function</text>
  <text x="62" y="666">Runs on every new event.</text>
  <text x="62" y="684">Sends a fixed message per event</text>
  <text x="62" y="702">type and the event id, never</text>
  <text x="62" y="720">text from the attacker.</text>

  <line x1="196" y1="750" x2="196" y2="878" stroke="#2EA8FF" stroke-width="2" marker-end="url(#arBlue)"/>
  <text class="small" x="210" y="812">fixed text + event id</text>

  <rect x="46" y="880" width="300" height="70" rx="12" fill="#0E1D33" stroke="#22395A"/>
  <use href="#ic-send" xlink:href="#ic-send" x="62" y="892" width="18" height="18" fill="none" stroke="#2EA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="86" y="906">Firebase Cloud Messaging</text>
  <text class="small dim" x="62" y="932">Google's push service</text>

  <line x1="346" y1="915" x2="450" y2="915" stroke="#2EA8FF" stroke-width="2" marker-end="url(#arBlue)"/>
  <text class="small c" x="398" y="905">push</text>

  <line x1="512" y1="752" x2="512" y2="828" stroke="#2EA8FF" stroke-width="2" marker-start="url(#arBlue)" marker-end="url(#arBlue)"/>
  <text class="small" x="526" y="796">HTTPS, Google sign-in,</text>
  <text class="small" x="526" y="813">row-level security</text>

  <rect x="452" y="830" width="120" height="170" rx="20" fill="#0A1424" stroke="#2C4466" stroke-width="2"/>
