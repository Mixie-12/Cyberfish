  <text x="46" y="1128">The card carries the Wi-Fi details and a one-time code.</text>
  <text x="46" y="1146">The same code pairs the Pi: 128 bits, usable once.</text>

  <rect x="520" y="1072" width="88" height="30" rx="15" fill="#0E1D33" stroke="#22395A"/>
