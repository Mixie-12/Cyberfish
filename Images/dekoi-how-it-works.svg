  <text class="eyebrow" x="40" y="56">HOW IT WORKS</text>
  <text class="title" x="40" y="90">Built to be attacked, safely</text>
  <text class="sub" x="40" y="118">The Pi only opens connections outward, over HTTPS. The decoys are sealed off from everything that matters.</text>

