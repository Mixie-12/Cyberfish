  <text class="small dim" x="716" y="288">Python, standard library only</text>
  <g fill="#2EA8FF">
    <circle cx="720" cy="313" r="2.5"/>
    <circle cx="720" cy="357" r="2.5"/>
    <circle cx="720" cy="419" r="2.5"/>
