  <text class="pill c" x="694" y="1091.5">Signed images</text>
  <line x1="756" y1="1087" x2="776" y2="1087" stroke="#6F84A3" stroke-width="1.6" marker-end="url(#arDim)"/>
  <rect x="780" y="1072" width="174" height="30" rx="15" fill="#0E1D33" stroke="#22395A"/>
  <text class="pill c" x="867" y="1091.5">Pi checks the signature</text>
  <text x="520" y="1128">The Pi runs only images signed with DeKoi's key,</text>
