  <rect width="1000" height="724" rx="24" fill="url(#bgGlow)"/>

  <use href="#fish" xlink:href="#fish" x="886" y="42" width="72" height="27" fill="#2EA8FF" filter="url(#glowSm)"/>
  <use href="#fish" xlink:href="#fish" x="886" y="42" width="72" height="27" fill="#F4FBFF"/>
  <text class="eyebrow" x="40" y="56">WHAT DEKOI DOES</text>
  <text class="title" x="40" y="90">A decoy on your network. Any touch is a signal.</text>
  <text class="sub" x="40" y="118">DeKoi looks like a storage box. Nothing legitimate talks to it, so when something does, the owner knows within seconds.</text>

  <rect x="24" y="150" width="576" height="350" rx="18" fill="#081221" stroke="#17263D"/>
  <text class="label" x="46" y="180">ALICE'S HOME NETWORK</text>

