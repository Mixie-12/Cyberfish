    <text x="373.6" y="681" style="font-size:12px;fill:#C9D6E8">Rogue DHCP servers</text>
    <text x="526.4" y="681" style="font-size:12px;fill:#C9D6E8">Rogue IPv6 routers</text>
    <text x="679.2" y="681" style="font-size:12px;fill:#C9D6E8">Name poisoning</text>
