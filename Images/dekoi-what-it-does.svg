      <path d="M-24 34C-24 15-13 7 0 7S24 15 24 34Z"/>
    </g>
  </g>
  <text class="name c" x="110" y="294">Bob</text>
  <text class="c" x="110" y="313">browses, streams, prints</text>
  <text class="c" x="110" y="330" style="fill:#34D399">DeKoi stays quiet</text>

  <line x1="148" y1="236" x2="258" y2="236" stroke="#34D399" stroke-width="2" marker-end="url(#arGreen)"/>
