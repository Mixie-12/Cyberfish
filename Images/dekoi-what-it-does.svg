  <text class="name r" x="846" y="214">Alice</text>
  <text class="r" x="846" y="233">the owner,</text>
  <text class="r" x="846" y="250">at home or away</text>

  <rect x="820" y="292" width="144" height="194" rx="22" fill="#0A1424" stroke="#2C4466" stroke-width="2"/>
  <rect x="870" y="301" width="44" height="7" rx="3.5" fill="#1A2B44"/>
