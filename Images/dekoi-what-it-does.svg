    <g clip-path="url(#avatar)">
      <path d="M-15 -5C-16 -19 -8 -23 0 -23S16 -19 15 -5C15 1 14 5 12 7H-12C-14 5 -15 1 -15 -5Z" fill="#7C5CE0"/>
      <circle cy="-8" r="10.5" fill="#A78BFA"/>
