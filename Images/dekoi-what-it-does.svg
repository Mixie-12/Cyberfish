  <text class="name c" x="702" y="446">DeKoi cloud</text>
  <text class="c" x="702" y="464">Supabase, EU</text>

  <line x1="534" y1="380" x2="652" y2="380" stroke="#2EA8FF" stroke-width="2" marker-end="url(#arBlue)"/>
  <circle cx="600" cy="380" r="12" fill="#2EA8FF" stroke="#040A15" stroke-width="3"/>
  <text class="c" x="600" y="384.5" style="fill:#040A15;font-weight:700">2</text>

  <line x1="766" y1="380" x2="814" y2="380" stroke="#A78BFA" stroke-width="2" marker-end="url(#arViolet)"/>
  <circle cx="790" cy="380" r="12" fill="#A78BFA" stroke="#040A15" stroke-width="3"/>
  <text class="c" x="790" y="384.5" style="fill:#040A15;font-weight:700">3</text>

