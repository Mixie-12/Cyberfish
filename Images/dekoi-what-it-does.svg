      .h { font-size: 14px; font-weight: 600; fill: #F4FBFF; }
      .small { font-size: 12px; }
      .dim { fill: #6F84A3; }
      .chip { font-size: 11px; fill: #C9D6E8; }
      .c { text-anchor: middle; }
      .r { text-anchor: end; }
    </style>
