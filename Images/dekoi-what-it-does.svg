<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="724" viewBox="0 0 1000 724" role="img" aria-labelledby="title desc">
  <title id="title">What DeKoi does</title>
  <desc id="desc">Bob uses the home network as usual and never touches DeKoi. Eve, an intruder, sees what looks like a storage box, scans it and tries to sign in. DeKoi reports this to the DeKoi cloud over HTTPS, and Alice, the owner, gets a plain-language alert on her phone within seconds.</desc>
