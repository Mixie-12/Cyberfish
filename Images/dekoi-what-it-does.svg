  <text x="868" y="337" style="font-size:10.5px;fill:#6F84A3">DeKoi · now</text>
  <text x="840" y="357" style="font-size:12.5px;font-weight:600;fill:#F4FBFF">Someone tried to</text>
  <text x="840" y="373" style="font-size:12.5px;font-weight:600;fill:#F4FBFF">sign in to your</text>
  <text x="840" y="389" style="font-size:12.5px;font-weight:600;fill:#F4FBFF">DeKoi</text>
  <text x="840" y="406" style="font-size:10.5px">Tap for what to do</text>
  <rect x="830" y="430" width="124" height="8" rx="4" fill="#16243A"/>
  <rect x="830" y="446" width="92" height="8" rx="4" fill="#16243A"/>
  <rect x="872" y="472" width="40" height="4" rx="2" fill="#2C4466"/>

  <rect x="24" y="526" width="304" height="84" rx="14" fill="#081221" stroke="#17263D"/>
  <circle cx="52" cy="552" r="13" fill="#FF5C70"/>
  <text class="c" x="52" y="556.5" style="fill:#FFFFFF;font-weight:700">1</text>
  <text class="h" x="76" y="557">Eve takes the bait</text>
  <text x="76" y="579">She scans, finds the storage box</text>
  <text x="76" y="597">and tries to sign in.</text>

  <rect x="348" y="526" width="304" height="84" rx="14" fill="#081221" stroke="#17263D"/>
  <circle cx="376" cy="552" r="13" fill="#2EA8FF"/>
  <text class="c" x="376" y="556.5" style="fill:#040A15;font-weight:700">2</text>
  <text class="h" x="400" y="557">DeKoi reports it</text>
  <text x="400" y="579">Only outward, over HTTPS. The</text>
  <text x="400" y="597">password Eve typed never leaves.</text>

  <rect x="672" y="526" width="304" height="84" rx="14" fill="#081221" stroke="#17263D"/>
  <circle cx="700" cy="552" r="13" fill="#A78BFA"/>
  <text class="c" x="700" y="556.5" style="fill:#040A15;font-weight:700">3</text>
  <text class="h" x="724" y="557">Alice gets an alert</text>
  <text x="724" y="579">In plain language, within seconds,</text>
  <text x="724" y="597">with what happened and what to do.</text>

  <rect x="24" y="626" width="952" height="76" rx="14" fill="#081221" stroke="#17263D"/>
  <text x="46" y="652" style="font-weight:600;fill:#C9D6E8">DeKoi also watches the whole network for</text>
