<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1536" viewBox="0 0 1536 1536">
  <!-- Adaptive icon background (108 dp): the screen of
       Images/cyberfish-app-icon.svg, its 1024 units centred as in the
       foreground. Two changes: the scan lines become their average tone,
       since at launcher sizes they are finer than a pixel and alias into
       bands; the glowing edge is left out, since the launcher picks the
       icon's shape. -->
  <defs>
    <radialGradient id="screen" cx="50%" cy="50%" r="50%" gradientTransform="translate(0.15 0.2) scale(0.7 0.6)">
      <stop offset="0" stop-color="#2EA8FF" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#2EA8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1536" height="1536" fill="#040A15"/>
  <rect x="256" y="256" width="1024" height="1024" fill="url(#screen)"/>
  <rect width="1536" height="1536" fill="#FFFFFF" fill-opacity="0.0386"/>
</svg>
