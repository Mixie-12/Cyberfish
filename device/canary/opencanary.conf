{
  "device.node_id": "dekoi",
  "ip.ignorelist": [],
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {"format": "%(message)s"}
      },
      "handlers": {
        "file": {
          "class": "logging.handlers.RotatingFileHandler",
          "filename": "/var/log/opencanary/opencanary.log",
          "maxBytes": 5242880,
          "backupCount": 1,
          "formatter": "plain"
        }
      }
    }
  },
  "ftp.enabled": true,
  "ftp.port": 21,
  "ftp.banner": "(vsFTPd 3.0.5)",
  "ftp.log_auth_attempt_initiated": false,
  "http.enabled": true,
  "http.port": 80,
  "http.banner": "nginx",
  "http.skin": "storage",
  "http.skindir": "/opt/dekoi/skin",
  "http.log_unimplemented_method_requests": false,
  "http.log_redirect_request": false,
  "https.enabled": false,
  "ssh.enabled": true,
  "ssh.port": 22,
  "ssh.version": "SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5",
  "ssh.key_path": "/var/lib/opencanary",
  "telnet.enabled": true,
  "telnet.port": 23,
  "telnet.banner": "",
  "telnet.honeycreds": [],
  "telnet.log_tcp_connection": false,
  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.42-0ubuntu0.18.04.1",
  "mysql.log_connection_made": false,
  "rdp.enabled": true,
  "rdp.port": 3389,
  "vnc.enabled": true,
  "vnc.port": 5900,
  "redis.enabled": true,
  "redis.port": 6379,
  "portscan.enabled": false
}
