# The decoy file share (ADR 0018), rendered with the persona at image build.
# Share names are listed to anyone, as on a real storage server. Nobody can
# sign in: no account exists and a failed sign-in is never turned into a
# guest session. Only Public opens without a password, and nothing is
# writable. smbd runs unprivileged in the canary container and nmbd in the
# announce container, both on a read-only root, so state lives in /tmp.
[global]
   netbios name = $name
   server string = $model
   server role = standalone server
   map to guest = never
   smb ports = 445
   max smbd processes = 20
   local master = no
   dns proxy = no
   load printers = no
   printcap name = /dev/null
   disable spoolss = yes
   usershare path =
   lock directory = /tmp/samba
   state directory = /tmp/samba
   cache directory = /tmp/samba
   pid directory = /tmp/samba
   private dir = /tmp/samba
   ncalrpc dir = /tmp/samba/ncalrpc
   nmbd:socket dir = /tmp/samba/nmbd
   log file = /tmp/samba/log
   max log size = 1024
   # What the agent reads (dekoi_agent.sources.parse_samba): failed sign-ins
   # as JSON with the user name and never the password, connections to a
   # share and reads from a file. Only these two classes go to this file.
   log level = 0 auth_json_audit:2@/var/log/opencanary/samba.log full_audit:1@/var/log/opencanary/samba.log
   vfs objects = full_audit
   full_audit:syslog = false
   full_audit:prefix = %I|%S|%P
   full_audit:success = connect pread pread_recv
   full_audit:failure = none

[Public]
   path = /srv/decoy/Public
   guest ok = yes

[Backups]
   path = /srv/decoy/locked

[Documents]
   path = /srv/decoy/locked

[Family Photos]
   path = /srv/decoy/locked

[Finance]
   path = /srv/decoy/locked

[Passwords-old]
   path = /srv/decoy/locked

[Tax returns]
   path = /srv/decoy/locked

[Wallet-backup]
   path = /srv/decoy/locked
