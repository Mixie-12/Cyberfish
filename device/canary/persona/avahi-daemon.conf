# mDNS for the decoy (ADR 0018), rendered with the persona at image build.
# Without D-Bus nothing can register services at runtime; only the static
# ones in /etc/avahi/services are published.
[server]
host-name=$name
use-ipv4=yes
use-ipv6=yes
enable-dbus=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
