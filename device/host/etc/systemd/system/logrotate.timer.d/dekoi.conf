# Hourly, so that the size limit of the scan log (logrotate.d/dekoi-scan)
# holds within an hour or two: at the firewall's log limit, 20 lines a
# second, a scan from the LAN writes tens of MB an hour to the card, and
# a daily check would let it grow by about a GB. Logs rotated daily still
# rotate once a day.
[Timer]
OnCalendar=
OnCalendar=hourly
