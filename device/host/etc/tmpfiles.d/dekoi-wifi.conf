# Where the Wi-Fi watch's host scan and the agent meet (ADR 0019): the host
# writes the scan, the agent (uid 10002) writes the country it was given.
# Both live in memory and are created again at every boot.
d /run/dekoi 0755 root root -
d /run/dekoi/wifi 0755 root root -
d /run/dekoi/wifi-country 0755 10002 10002 -
