#!/usr/sbin/nft -f
# DeKoi firewall. Only the decoys answer. A new connection attempt to any
# other TCP port is logged to ulogd2 (netlink group 1) for port scan
# detection, then dropped. The decoy ports must match the decoys and their
# announcements (device/agent/dekoi_agent/decoys.py, device/canary); a test
# enforces this.

flush ruleset

table inet dekoi {
	# The canary's decoys (OpenCanary and the Samba file share), and the
	# WS-Discovery metadata that Windows fetches over HTTP.
	set decoy_tcp_ports {
		type inet_service
		elements = { 21, 22, 23, 80, 445, 3306, 3389, 3702, 5900, 6379 }
	}

	# The announcements: NetBIOS names and datagrams (nmbd), WS-Discovery
	# (wsdd2) and mDNS (avahi-daemon).
	set decoy_udp_ports {
		type inet_service
		elements = { 137, 138, 3702, 5353 }
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		# Answers to the agent's name poisoning probes (LLMNR, mDNS, NBT-NS).
		udp sport { 137, 5353, 5355 } udp dport 32768-60999 accept
		tcp dport @decoy_tcp_ports accept
		udp dport @decoy_udp_ports accept
		tcp flags & (fin | syn | rst | ack) == syn limit rate 20/second burst 50 packets log prefix "dekoi-scan" group 1
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
