#!/usr/sbin/nft -f
# DeKoi firewall. Only the decoys answer. A new connection attempt to any
# other TCP port is logged to ulogd2 (netlink group 1) for port scan
# detection, then dropped. The decoy ports must match the enabled services in
# device/canary/opencanary.conf; a test enforces this.

flush ruleset

table inet dekoi {
	set decoy_tcp_ports {
		type inet_service
		elements = { 21, 22, 23, 80, 3306, 3389, 5900, 6379 }
	}

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		tcp dport @decoy_tcp_ports accept
		tcp flags & (fin | syn | rst | ack) == syn limit rate 20/second burst 50 packets log prefix "dekoi-scan" group 1
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
