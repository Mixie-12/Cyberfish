#cloud-config
# DeKoi first boot on Raspberry Pi OS Lite (cloudinit-rpi).
#
# This is a template. DeKoi Setup renders it when it writes a card: every
# "content: !file PATH" is replaced by the file at device/PATH, and
# __CLAIM_CODE__ by the claim code shown as the QR code. Nothing else differs
# between customers.
#
# Host configuration written here is never updated afterwards; keep it small
# and generic. Everything likely to change lives in the container images,
# which update themselves.

# The persona's name (device/canary/persona/persona.json; a test keeps them
# equal), so the router's device list and local DNS show the decoy too.
hostname: family-nas
manage_etc_hosts: true

# One locked account with no shell, so Raspberry Pi OS does not wait for a
# first user to be created. Nobody can log in to the device.
users:
  - name: dekoi
    lock_passwd: true
    shell: /usr/sbin/nologin
ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true
package_reboot_if_required: true
packages:
  - podman
  - nftables
  - ulogd2
  - ulogd2-json
  - unattended-upgrades
  # Both ship with Raspberry Pi OS Lite; named because the Wi-Fi watch's
  # scan (ADR 0019) uses them.
  - iw
  - raspi-config

# Deferred: written after the packages are installed, so package defaults do
# not overwrite them.
write_files:
  # UserNS=auto (dekoi-canary.container) takes unprivileged uid and gid ranges
  # from the "containers" entries; Debian does not create them.
  - path: /etc/subuid
    append: true
    defer: true
    content: |
      containers:2147483647:2147483648
  - path: /etc/subgid
    append: true
    defer: true
    content: |
      containers:2147483647:2147483648
  - path: /etc/dekoi/claim-code
    permissions: "0444"
    defer: true
    content: "__CLAIM_CODE__"
  - path: /etc/dekoi/cosign.pub
    permissions: "0444"
    defer: true
    content: !file host/etc/dekoi/cosign.pub
  - path: /etc/containers/policy.json
    permissions: "0644"
    defer: true
    content: !file host/etc/containers/policy.json
  - path: /etc/containers/registries.d/dekoi.yaml
    permissions: "0644"
    defer: true
    content: !file host/etc/containers/registries.d/dekoi.yaml
  - path: /etc/containers/systemd/dekoi-canary.container
    permissions: "0644"
    defer: true
    content: !file host/etc/containers/systemd/dekoi-canary.container
  - path: /etc/containers/systemd/dekoi-announce.container
    permissions: "0644"
    defer: true
    content: !file host/etc/containers/systemd/dekoi-announce.container
  - path: /etc/containers/systemd/dekoi-agent.container
    permissions: "0644"
    defer: true
    content: !file host/etc/containers/systemd/dekoi-agent.container
  - path: /etc/containers/systemd/dekoi-ids.container
    permissions: "0644"
    defer: true
    content: !file host/etc/containers/systemd/dekoi-ids.container
  - path: /etc/nftables.conf
    permissions: "0755"
    defer: true
    content: !file host/etc/nftables.conf
  - path: /etc/ulogd.conf
    permissions: "0644"
    defer: true
    content: !file host/etc/ulogd.conf
  - path: /etc/logrotate.d/dekoi-scan
    permissions: "0644"
    defer: true
    content: !file host/etc/logrotate.d/dekoi-scan
  - path: /etc/systemd/system/ulogd2.service.d/dekoi.conf
    permissions: "0644"
    defer: true
    content: !file host/etc/systemd/system/ulogd2.service.d/dekoi.conf
  - path: /etc/systemd/journald.conf.d/dekoi.conf
    permissions: "0644"
    defer: true
    content: !file host/etc/systemd/journald.conf.d/dekoi.conf
  - path: /etc/systemd/system.conf.d/dekoi.conf
    permissions: "0644"
    defer: true
    content: !file host/etc/systemd/system.conf.d/dekoi.conf
  - path: /etc/sysctl.d/90-dekoi.conf
    permissions: "0644"
    defer: true
    content: !file host/etc/sysctl.d/90-dekoi.conf
  - path: /etc/apt/apt.conf.d/52dekoi
    permissions: "0644"
    defer: true
    content: !file host/etc/apt/apt.conf.d/52dekoi
  - path: /etc/tmpfiles.d/dekoi-wifi.conf
    permissions: "0644"
    defer: true
    content: !file host/etc/tmpfiles.d/dekoi-wifi.conf
  - path: /usr/local/libexec/dekoi-wifi-scan
    permissions: "0755"
    defer: true
    content: !file host/usr/local/libexec/dekoi-wifi-scan
  - path: /etc/systemd/system/dekoi-wifi-scan.service
    permissions: "0644"
    defer: true
    content: !file host/etc/systemd/system/dekoi-wifi-scan.service
  - path: /etc/systemd/system/dekoi-wifi-scan.timer
    permissions: "0644"
    defer: true
    content: !file host/etc/systemd/system/dekoi-wifi-scan.timer

runcmd:
  - [systemctl, mask, --now, ssh.service, ssh.socket, avahi-daemon.service, avahi-daemon.socket]
  - [install, -d, -m, "0755", /var/log/ulog]
  - [sysctl, --system]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, nftables.service]
  - [systemctl, restart, ulogd2.service, systemd-journald.service]
  - [systemctl, enable, systemd-time-wait-sync.service]
  - [systemctl, enable, --now, podman-auto-update.timer]
  # The agent mounts these directories, so they exist before it starts.
  - [systemd-tmpfiles, --create, /etc/tmpfiles.d/dekoi-wifi.conf]
  - [systemctl, start, dekoi-canary.service, dekoi-announce.service, dekoi-agent.service, dekoi-ids.service]
  - [systemctl, enable, --now, dekoi-wifi-scan.timer]
